<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>JSP에서 include될 페이지가 타임리프에서는 fragment(조각)</h1>
    <div th:fragment="content2(param1, param2)" style="background-color:orange">
        삽입 될 영역2(파라미터를 전달받아서 사용할 수 있다)
        <br>
        <span th:text="${param1}"></span>
        <span th:text="${param2}"></span>
    </div>
</body>
</html>
